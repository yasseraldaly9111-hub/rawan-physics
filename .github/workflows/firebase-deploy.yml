# ينشر الموقع وقواعد الحماية على Firebase تلقائيًا عند كل دفع (push) إلى الفرع main
name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Deploy hosting and Firestore rules
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_SA" ] || [ -z "$PROJECT_ID" ]; then
            echo "::warning::Deploy skipped: add the FIREBASE_SERVICE_ACCOUNT secret and the FIREBASE_PROJECT_ID variable in Settings > Secrets and variables > Actions"
            exit 0
          fi
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          firebase deploy --only hosting,firestore:rules --project "$PROJECT_ID" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
